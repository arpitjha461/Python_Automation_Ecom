
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Console logging
log_cli = true
log_cli_level = INFO

# Log file configuration
log_file = reports/automation.log
log_file_level = INFO
log_file_mode = a

# Log format
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
